name: Hugo regression

on: [pull_request]

permissions:
  contents: read

env:
  SITE_PREFIX: /
  HUGO_VERSION: '0.131.0'

jobs:
  build:
    outputs:
      site-prefix: ${{ env.SITE_PREFIX }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the website
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" hugo
          "$RUNNER_TEMP/hugo" --destination public --baseURL "http://127.0.0.1:8000${SITE_PREFIX%/}/"
      - uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: public
          if-no-files-found: error

  check:
    needs: build
    uses: FaKleiser/sireg/.github/workflows/sireg.yml@master
    with:
      sitemap: https://example.com/sitemap.xml
      site-artifact: built-site
      site-prefix: ${{ needs.build.outputs.site-prefix }}
