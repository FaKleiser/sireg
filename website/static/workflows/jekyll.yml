name: Jekyll regression

on: [pull_request]

permissions:
  contents: read

env:
  SITE_PREFIX: /

jobs:
  build:
    outputs:
      site-prefix: ${{ env.SITE_PREFIX }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build the website
        run: |
          bundle exec jekyll build --baseurl "${SITE_PREFIX%/}"
      - uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
          if-no-files-found: error

  check:
    needs: build
    uses: FaKleiser/sireg/.github/workflows/sireg.yml@master
    with:
      sitemap: https://example.com/sitemap.xml
      site-artifact: built-site
      site-prefix: ${{ needs.build.outputs.site-prefix }}
