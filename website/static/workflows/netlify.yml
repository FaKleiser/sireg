name: Netlify preview regression

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: FaKleiser/sireg/.github/workflows/sireg-netlify.yml@master
    with:
      sitemap: https://example.com/sitemap.xml
      site-id: ${{ vars.NETLIFY_SITE_ID }}
    secrets:
      token: ${{ secrets.NETLIFY_TOKEN }}
