name: Next.js static export regression

on: [pull_request]

permissions:
  contents: read

env:
  SITE_PREFIX: /

jobs:
  build:
    outputs:
      site-prefix: ${{ env.SITE_PREFIX }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the website
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: out
          if-no-files-found: error

  check:
    needs: build
    uses: FaKleiser/sireg/.github/workflows/sireg.yml@master
    with:
      sitemap: https://example.com/sitemap.xml
      site-artifact: built-site
      site-prefix: ${{ needs.build.outputs.site-prefix }}
