<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default "Sitemap-driven website regression checks for local builds, previews, and CI." }}">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}sireg</title>
  <link rel="stylesheet" href="{{ "site.css" | relURL }}">
  {{ if .IsHome }}<link rel="stylesheet" href="{{ "home.css" | relURL }}">{{ end }}
  <script src="{{ "site.js" | relURL }}" defer></script>
</head>
<body{{ if .IsHome }} class="home-page"{{ end }}>
  <a class="skip" href="#main">Skip to content</a>
  <header class="header">
    <div class="shell header-inner">
      <a class="brand" href="{{ .Site.Home.RelPermalink }}">
        <span class="brand-mark" aria-hidden="true"><i></i><b></b></span>
        sireg
      </a>
      <div class="project-links">
        <a href="https://www.npmjs.com/package/sireg">npm <span aria-hidden="true">↗</span></a>
        <a href="https://github.com/FaKleiser/sireg">GitHub <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </header>
  <div class="shell site-layout">
    <div class="desktop-nav">{{ partial "navigation.html" (dict "page" . "group" "desktop-docs") }}</div>
    <details class="mobile-nav">
      <summary>Browse documentation</summary>
      {{ partial "navigation.html" (dict "page" . "group" "compact-docs") }}
    </details>
    <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  </div>
  <footer class="shell footer">
    <span>sireg</span>
    <a href="https://github.com/FaKleiser/sireg/blob/master/LICENSE">MIT license <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
