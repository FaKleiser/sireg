{{- $current := .page -}}
<nav class="docs-nav" aria-label="Documentation">
  <a href="{{ $current.Site.Home.RelPermalink }}"{{ if $current.IsHome }} aria-current="page"{{ end }}>Home</a>
  {{ range slice "/guides" "/ci-cd" "/reference" "/development" }}
    {{ with $current.Site.GetPage . }}
      <details class="nav-group" name="{{ $.group }}"{{ if eq .Section $current.Section }} open{{ end }}>
        <summary>{{ .Title }}</summary>
        <ul>
          <li><a href="{{ .RelPermalink }}"{{ if eq . $current }} aria-current="page"{{ end }}>Overview</a></li>
          {{ range .RegularPages.ByWeight }}
            <li><a href="{{ .RelPermalink }}"{{ if eq . $current }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a></li>
          {{ end }}
        </ul>
      </details>
    {{ end }}
  {{ end }}
</nav>
