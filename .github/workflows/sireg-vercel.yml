name: Check Vercel preview routes with sireg

on:
  workflow_call:
    inputs:
      sitemap:
        description: Production sitemap URL containing the routes to check
        required: true
        type: string
      project-id:
        description: Vercel project id
        required: true
        type: string
      team-id:
        description: Vercel team id for a team-owned project
        type: string
      probe-path:
        description: Canonical path on the preview that returns HTTP 200
        type: string
        default: /
      limit:
        description: Maximum routes to sample, or 0 to check the entire sitemap
        type: number
        default: 25
    secrets:
      token:
        description: Vercel API token that can list deployments
        required: true

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_PROBE_PATH: ${{ inputs.probe-path }}
      VERCEL_PROJECT_ID: ${{ inputs.project-id }}
      VERCEL_TEAM_ID: ${{ inputs.team-id }}
    outputs:
      origin: ${{ steps.preview.outputs.origin }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the deployment for this commit
        id: preview
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_TOKEN: ${{ secrets.token }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { performance } = require('node:perf_hooks');
          const { setTimeout: sleep } = require('node:timers/promises');

          const { PR_HEAD_SHA, PREVIEW_PROBE_PATH, GITHUB_OUTPUT } = process.env;
          const { VERCEL_PROJECT_ID, VERCEL_TEAM_ID, VERCEL_TOKEN } = process.env;
          if (!VERCEL_PROJECT_ID || !VERCEL_TOKEN) {
            throw new Error('Provide the project-id input and token secret.');
          }
          const api = new URL('https://api.vercel.com/v7/deployments');
          api.searchParams.set('projectId', VERCEL_PROJECT_ID);
          api.searchParams.set('limit', '50');
          if (VERCEL_TEAM_ID) api.searchParams.set('teamId', VERCEL_TEAM_ID);

          const deadline = performance.now() + 300_000;

          async function fetchBeforeDeadline(url, headers) {
            const remaining = deadline - performance.now();
            if (remaining < 1) return;
            try {
              return await fetch(url, {
                headers,
                redirect: 'manual',
                signal: AbortSignal.timeout(Math.min(10_000, Math.floor(remaining))),
              });
            } catch (error) {
              console.warn(`Request to ${url.hostname} failed (${error.message}); retrying.`);
            }
          }

          async function findDeployment() {
            api.searchParams.delete('until');
            while (performance.now() < deadline) {
              const response = await fetchBeforeDeadline(api, { Authorization: `Bearer ${VERCEL_TOKEN}` });
              if (!response) return;
              if (!response.ok) {
                await response.body?.cancel();
                if (response.status === 429 || response.status >= 500) {
                  console.warn(`Vercel API returned HTTP ${response.status}; retrying.`);
                  return;
                }
                throw new Error(`Vercel API returned HTTP ${response.status}. Check the configured IDs and API token.`);
              }
              const { deployments, pagination } = await response.json();
              const match = deployments.find((deploy) =>
                deploy.projectId === VERCEL_PROJECT_ID &&
                deploy.target == null && !deploy.customEnvironment &&
                deploy.meta?.githubCommitSha === PR_HEAD_SHA
              );
              if (match || !pagination.next) return match;
              api.searchParams.set('until', pagination.next);
            }
          }

          async function waitForPreview() {
            while (performance.now() < deadline) {
              const deployment = await findDeployment();
              if (deployment) {
                const state = deployment.readyState;
                if (['ERROR', 'CANCELED', 'DELETED', 'BLOCKED'].includes(state)) {
                  throw new Error(`Vercel deployment for ${PR_HEAD_SHA} failed (${state}).`);
                }
                if (state === 'READY' && deployment.url) {
                  const preview = new URL(`https://${deployment.url}`);
                  const probe = new URL(PREVIEW_PROBE_PATH, preview);
                  if (preview.protocol !== 'https:' || preview.href !== `${preview.origin}/` ||
                      probe.origin !== preview.origin) {
                    throw new Error('Expected an HTTPS deployment origin and a probe path on that origin.');
                  }
                  const response = await fetchBeforeDeadline(probe);
                  await response?.body?.cancel();
                  if (response?.status === 200 && performance.now() < deadline) {
                    appendFileSync(GITHUB_OUTPUT, `origin=${preview.origin}\n`);
                    return;
                  }
                  if (response?.status >= 300 && response.status < 400) {
                    throw new Error(`Preview probe redirected (HTTP ${response.status}). Use a canonical preview path.`);
                  }
                  if ([401, 403].includes(response?.status)) {
                    throw new Error(`Preview probe returned HTTP ${response.status}. Check deployment protection.`);
                  }
                  if (response) console.warn(`Preview probe returned HTTP ${response.status}; retrying.`);
                }
              }
              await sleep(Math.max(0, Math.min(5_000, deadline - performance.now())));
            }
            throw new Error(`Timed out after 5 minutes waiting for a reachable Vercel preview for ${PR_HEAD_SHA}.`);
          }

          waitForPreview().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
  check:
    needs: discover
    uses: ./.github/workflows/sireg.yml
    with:
      sitemap: ${{ inputs.sitemap }}
      origin: ${{ needs.discover.outputs.origin }}
      limit: ${{ inputs.limit }}
      report-name: sireg-vercel-report
