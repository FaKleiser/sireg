name: Documentation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.131.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" hugo
      - name: Build and verify documentation
        run: |
          npm ci
          npm run build
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            export HUGO_BASEURL=http://localhost:8000/sireg/
          fi
          "$RUNNER_TEMP/hugo" --source website --panicOnWarning --cleanDestinationDir
          sh website/verify.sh
      - name: Package the verified PR preview
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/docs-preview"
          cp -R website/public "$RUNNER_TEMP/docs-preview/sireg"
      - name: Upload the PR preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: ${{ runner.temp }}/docs-preview/
          if-no-files-found: error
      - name: Link the preview in the run summary
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo '## Documentation preview'
            printf '[Download docs-preview.zip](%s).\n\n' "$PREVIEW_URL"
            echo 'Extract the archive and run this from the directory containing the extracted sireg folder:'
            echo
            echo '```sh'
            echo 'python3 -m http.server 8000 --bind 127.0.0.1'
            echo '```'
            echo
            echo 'Open [http://localhost:8000/sireg/](http://localhost:8000/sireg/).'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: website/public

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
